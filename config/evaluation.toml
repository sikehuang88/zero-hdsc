# Evaluation configuration. Used by evals/runners and scripts/run_eval.py.

[eval]
seeds = [1, 2, 3, 4, 5]
token_budget = 2000
prompt_token_cap_ratio = 0.5

[eval.thresholds]
factual_memory_accuracy = 0.90
source_classification_accuracy = 0.98
model_as_user_fact = 0
state_boundary_violations = 0
causal_trace_coverage = 1.00
cross_model_memory_retention = 0.90
blind_space_distinction = 0.75
initiative_relevance_avg = 4.0
initiative_intrusion_avg = 2.0
soak_duplicate_jobs_24h = 0
soak_unprocessed_outbox_24h = 0
