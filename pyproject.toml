[project]
name = "ssa"
version = "0.1.0"
description = "Stateless Space Activation — a digital lifeform prototype"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "SSA Project" },
]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "loguru>=0.7",
    "numpy>=1.26",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Core runtime (LLM + embeddings + vector store)
runtime = [
    "litellm>=1.40",
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1.0",
]
# Telegram interface
telegram = [
    "python-telegram-bot>=21.0",
]
# CLI
cli = [
    "typer>=0.12",
]
# Scheduler
scheduler = [
    "apscheduler>=3.10",
]
# Optional observability dashboard
dashboard = [
    "streamlit>=1.30",
]
# Everything
all = [
    "ssa[runtime,telegram,cli,scheduler,dashboard]",
]

[project.scripts]
ssa = "ssa.interfaces.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssa"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # assert False is fine in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
files = ["src/ssa"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["sqlite_vec.*", "sentence_transformers.*", "litellm.*", "telegram.*", "apscheduler.*"]
ignore_missing_imports = true
