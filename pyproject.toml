[project]
name = "hdsc"
version = "0.5.0"
description = "Hyperdimensional Space Computing — a digital life research prototype"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "HDSC Project" },
]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "numpy>=1.26",
    "scipy>=1.12",
    "jinja2>=3.1",
    "rich>=14.0",
    "sqlite-vec>=0.1.0",
    "tzdata>=2026.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Core runtime (LLM + embeddings + vector store)
runtime = [
    "litellm>=1.93.0",
    "sentence-transformers>=3.0",
]
# Telegram interface
telegram = [
    "python-telegram-bot>=21.0",
]
# Scheduler
scheduler = [
    "apscheduler>=3.10",
]
# Optional observability dashboard
dashboard = [
    "streamlit>=1.30",
]
# Everything
all = [
    "hdsc[runtime,telegram,scheduler,dashboard]",
]
web = [
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
    "uvicorn>=0.30",
    "websockets>=15,<17",
    "msgpack>=1.1,<2",
]

[project.scripts]
hdsc = "ssa.interfaces.cli:main"
ssa = "ssa.interfaces.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssa"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "ssa/migrations"
"src/ssa/builtin_skills/zero-web-search/SKILL.md" = "ssa/builtin_skills/zero-web-search/SKILL.md"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # assert False is fine in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
files = ["src/ssa"]
exclude = ["numpy/__init__.pyi"]

[[tool.mypy.overrides]]
module = ["sqlite_vec.*", "sentence_transformers.*", "litellm.*", "telegram.*", "apscheduler.*", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
ignore_errors = true
